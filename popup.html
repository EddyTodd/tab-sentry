<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tab Lockdown</title>
    <style>
      body { font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 12px; color: #eaeaea; background: #1f1f1f; min-width: 220px; }
      .row { display: flex; align-items: center; justify-content: space-between; }
      .label { font-weight: 600; }
      .switch { position: relative; width: 48px; height: 26px; background: #555; border-radius: 13px; cursor: pointer; transition: background .15s ease; }
      .switch.on { background: #4caf50; }
      .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 10px; transition: left .15s ease; }
      .switch.on .knob { left: 25px; }
      .hint { margin-top: 8px; color: #b9b9b9; }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="label">Tab Lockdown</div>
      <div id="toggle" class="switch"><div class="knob"></div></div>
    </div>
    <div class="hint">Blocks all new tabs/windows when ON.</div>
    <script src="popup.js"></script>
  </body>
</html>
